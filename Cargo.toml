[package]
name = "corgi-build"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "PoC: deterministic, content-addressed, lock-free cargo-compatible build tool"
license = "MIT"
repository = "https://github.com/ConradIrwin/corgi"
readme = "README.md"

[[bin]]
name = "corgi"
path = "src/main.rs"

[[test]]
name = "end_to_end"
path = "tests/end_to_end.rs"

[dependencies]
anyhow = "1"
cargo-zigbuild = { version = "=0.23.0", default-features = false }
clap = { version = "4.5", default-features = false, features = [
    "derive",
    "error-context",
    "help",
    "std",
    "usage",
] }
dirs = "6"
dunce = "1"
glob = "0.3"
jobserver = "0.1.35"
libc = "0.2"
memchr = "2.8.3"
path-slash = "0.2"
pathdiff = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.11.0"
tar = { version = "0.4", default-features = false }
toml = "0.8"
toml_edit = "0.22"
zstd = { version = "0.13", default-features = false }

[target.'cfg(windows)'.dependencies]
find-msvc-tools = "0.1.14"
flatbuffers = "25"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

# Debug builds of Corgi hash gigabytes of toolchain and source files.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
codegen-units = 1
panic = "abort"
